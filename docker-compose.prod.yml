services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/aggregator.db
    volumes:
      - aggregator-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  aggregator-data:
